<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>농지의 QR 생성기</title>
<meta name="description" content="시리얼 번호만 붙여넣으면 QR 라벨을 한 번에. 1.7 × 1.9cm 라벨로 A4 한 줄 10개씩, 인쇄용 PDF와 PNG 이미지로 바로 받을 수 있어요.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f5eff">
<meta property="og:type" content="website">
<meta property="og:site_name" content="농지의 QR 생성기">
<meta property="og:title" content="농지의 QR 생성기">
<meta property="og:description" content="시리얼 번호만 붙여넣으면 QR 라벨을 한 번에. 1.7 × 1.9cm 라벨로 A4 한 줄 10개씩, 인쇄용 PDF와 PNG 이미지로 바로 받을 수 있어요.">
<meta property="og:url" content="https://jinhong-lee.github.io/qr-label-maker/">
<meta property="og:image" content="https://jinhong-lee.github.io/qr-label-maker/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="농지의 QR 생성기">
<meta name="twitter:description" content="시리얼 번호만 붙여넣으면 QR 라벨을 한 번에. 1.7 × 1.9cm 라벨로 A4 한 줄 10개씩, 인쇄용 PDF와 PNG 이미지로 바로 받을 수 있어요.">
<meta name="twitter:image" content="https://jinhong-lee.github.io/qr-label-maker/og-image.png">
<style>
  :root {
    --ink: #0f0f10; --sub: #6b7076; --line: #dbdcdf; --bg: #f5f6f7;
    --card: #fff; --accent: #1f5eff; --warn-bg: #fff6e0; --warn: #8a5a00;
    --err-bg: #feecec; --err: #c41d1d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label.t { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; height: 320px; resize: vertical; padding: 12px; border: 1px solid var(--line);
    border-radius: 8px; font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; }
  textarea:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--sub); font-size: 12px; margin: 6px 0 0; }
  .count { font-size: 13px; margin: 14px 0 0; }
  .count b { font-size: 18px; }
  .msg { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; font-size: 13px; }
  .opts { align-items: center; }
  .opts label { display: flex; align-items: center; gap: 6px; }
  .opts select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
  .size-info { color: var(--sub); font-size: 12px; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 16px; cursor: pointer; border: 1px solid transparent; }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover:not(:disabled) { filter: brightness(1.08); }
  .secondary { background: #fff; color: var(--ink); border-color: var(--line); }
  .secondary:hover:not(:disabled) { background: #f2f3f5; }
  button:disabled { opacity: .4; cursor: default; }
  .print-note { font-size: 12px; color: var(--sub); margin: 4px 0 0; }
  .print-note b { color: var(--ink); }
  .preview-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .preview-head h2 { font-size: 15px; margin: 0; }
  .preview-head span { color: var(--sub); font-size: 12px; }
  .pages { display: flex; flex-direction: column; gap: 20px; background: #e9eaec; margin: 0 -20px -20px; padding: 20px; border-radius: 0 0 12px 12px; }
  .page-no { font-size: 12px; color: var(--sub); margin: 0 0 6px; }
  .sheet { position: relative; width: 100%; aspect-ratio: 210 / 297; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .sheet canvas { position: absolute; }
  .empty { color: var(--sub); text-align: center; padding: 80px 16px; border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>농지의 QR 생성기</h1>
  <p class="lead">시리얼 번호를 붙여넣으면 QR + 번호 라벨을 A4 한 장에 맞춰 한 번에 만듭니다.</p>

  <div class="grid">
    <div class="card">
      <label class="t" for="input">시리얼 번호 (한 줄에 하나)</label>
      <textarea id="input" spellcheck="false" placeholder="SP2210260051&#10;SP2210260052&#10;SP2210260053"></textarea>
      <p class="hint">엑셀 열을 복사해서 그대로 붙여넣어도 됩니다. 빈 줄은 무시돼요.</p>

      <p class="count">라벨 <b id="count">0</b>개 · A4 <span id="pages">0</span>장</p>
      <div id="msgs"></div>

      <div class="opts">
        <span class="size-info" id="sizeInfo"></span>
      </div>

      <div class="actions">
        <button class="primary" id="btnPdf" disabled>인쇄용 PDF 받기</button>
        <p class="print-note">인쇄할 때 배율을 <b>"실제 크기(100%)"</b>로 설정하세요. "용지에 맞춤"으로 인쇄하면 크기가 바뀝니다.</p>
        <button class="secondary" id="btnZip" disabled>PNG 이미지 묶음(ZIP) 받기</button>
      </div>
    </div>

    <div class="card">
      <div class="preview-head">
        <h2>미리보기</h2>
        <span id="previewSize"></span>
      </div>
      <div id="preview"><div class="empty">왼쪽에 시리얼 번호를 붙여넣으면 여기에 라벨이 표시됩니다.</div></div>
    </div>
  </div>
</div>

<script src="lib/qrcode.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script>
// ===== 라벨 규격 (mm) — 고정 크기 1.7 × 1.9cm =====
const LABEL_W_MM = 17, LABEL_H_MM = 19;
const A4_W = 210, A4_H = 297, MARGIN = 5;   // 프린터 인쇄 불가 영역 고려한 여백
const GAP = 3;                               // 라벨 사이 간격(가로·세로 동일)
const DPI = 600;
const PX = mm => Math.round(mm / 25.4 * DPI);
let COLS, ROWS, PER_PAGE, LABEL_W, LABEL_H, PAD, QR_SIZE, TEXT_TOP, OFFSET_X, OFFSET_Y;

function layout() {
  LABEL_W = LABEL_W_MM; LABEL_H = LABEL_H_MM;    // 라벨끼리 붙여서 배치(구분선 없음)
  COLS = 10;                                       // 한 줄 10개 고정, 가운데 정렬
  ROWS = Math.floor((A4_H - MARGIN * 2 + GAP) / (LABEL_H + GAP));
  PER_PAGE = COLS * ROWS;
  PAD = LABEL_W * 0.045;                           // 안쪽 여백 — 이웃 라벨과의 흰 간격 역할
  QR_SIZE = LABEL_W - PAD * 2;
  TEXT_TOP = PAD + QR_SIZE;
  OFFSET_X = (A4_W - (COLS * LABEL_W + (COLS - 1) * GAP)) / 2;
  OFFSET_Y = (A4_H - (ROWS * LABEL_H + (ROWS - 1) * GAP)) / 2;
  const cm = v => String(v / 10);
  $('sizeInfo').textContent = `라벨 ${cm(LABEL_W)} × ${cm(LABEL_H)}cm · A4 한 장에 ${COLS}개 × ${ROWS}줄 = ${PER_PAGE}개`;
  $('previewSize').textContent = `실제 인쇄 크기: 가로 ${cm(LABEL_W)}cm × 세로 ${cm(LABEL_H)}cm`;
}

const MIN_MODULE_MM = 0.33; // QR 한 칸이 이보다 작으면 휴대폰 스캔이 어려움

const $ = id => document.getElementById(id);
let serials = [];

function parse(text) {
  return text.split(/\r?\n/)
    .map(line => line.split('\t')[0].trim())   // 엑셀 여러 열 복사 시 첫 열만
    .filter(Boolean);
}

function makeQR(text) {
  const qr = qrcode(0, 'M');                    // 버전 자동, 오류정정 M(15%)
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  qr.addData(text, 'Byte');
  qr.make();
  return qr;
}

function drawLabel(text) {
  const c = document.createElement('canvas');
  c.width = PX(LABEL_W); c.height = PX(LABEL_H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);

  // QR — 모듈을 정수 픽셀로 맞춰 선명하게
  const qr = makeQR(text);
  const n = qr.getModuleCount();
  const area = PX(QR_SIZE);
  const cell = Math.floor(area / n);
  const size = cell * n;
  const x0 = Math.round((c.width - size) / 2);
  const y0 = PX(PAD) + Math.round((area - size) / 2);
  ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++)
    for (let col = 0; col < n; col++)
      if (qr.isDark(r, col)) ctx.fillRect(x0 + col * cell, y0 + r * cell, cell, cell);

  // 텍스트 — 라벨 폭에 맞게 자동 축소
  const zoneTop = PX(TEXT_TOP), zoneH = c.height - zoneTop;
  const maxW = c.width - PX(PAD) * 2;
  let fs = PX(LABEL_H * 0.087);
  const font = s => `${s}px Arial, Helvetica, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
  ctx.font = font(fs);
  while (ctx.measureText(text).width > maxW && fs > PX(LABEL_H * 0.04)) { fs -= 2; ctx.font = font(fs); }
  ctx.fillStyle = '#222';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, c.width / 2, zoneTop + zoneH / 2);

  return { canvas: c, modules: n, tooSmall: ctx.measureText(text).width > maxW };
}

// 페이지 안 k번째 라벨의 위치(mm) — 미리보기와 PDF가 같은 함수를 씀
function pos(k) {
  return { x: OFFSET_X + (k % COLS) * (LABEL_W + GAP), y: OFFSET_Y + Math.floor(k / COLS) * (LABEL_H + GAP) };
}

function render() {
  layout();
  serials = parse($('input').value);
  const count = serials.length;
  $('count').textContent = count;
  $('pages').textContent = count ? Math.ceil(count / PER_PAGE) : 0;
  $('btnPdf').disabled = $('btnZip').disabled = !count;

  const msgs = [];
  const seen = new Map();
  serials.forEach(s => seen.set(s, (seen.get(s) || 0) + 1));
  const dups = [...seen].filter(([, v]) => v > 1);
  if (dups.length)
    msgs.push(['warn', `중복된 번호가 ${dups.length}개 있습니다 (${dups.slice(0, 3).map(d => d[0]).join(', ')}${dups.length > 3 ? ' 외' : ''}). 같은 라벨이 여러 장 출력됩니다.`]);

  const pv = $('preview');
  pv.innerHTML = '';
  if (!count) {
    pv.innerHTML = '<div class="empty">왼쪽에 시리얼 번호를 붙여넣으면 여기에 라벨이 표시됩니다.</div>';
  } else {
    const box = document.createElement('div'); box.className = 'pages';
    const total = Math.ceil(count / PER_PAGE);
    const pct = (v, base) => (v / base * 100) + '%';
    let sheet;
    const dense = [], longText = [];
    serials.forEach((s, i) => {
      const k = i % PER_PAGE;
      if (k === 0) {
        const wrap = document.createElement('div');
        wrap.innerHTML = `<p class="page-no">${i / PER_PAGE + 1} / ${total}쪽</p>`;
        sheet = document.createElement('div'); sheet.className = 'sheet';
        wrap.appendChild(sheet); box.appendChild(wrap);
      }
      const { canvas, modules, tooSmall } = drawLabel(s);
      const { x, y } = pos(k);
      canvas.title = s;
      Object.assign(canvas.style, { left: pct(x, A4_W), top: pct(y, A4_H), width: pct(LABEL_W, A4_W), height: pct(LABEL_H, A4_H) });
      sheet.appendChild(canvas);
      if (QR_SIZE / modules < MIN_MODULE_MM) dense.push(s);
      if (tooSmall) longText.push(s);
    });
    pv.appendChild(box);
    if (dense.length) msgs.push(['err', `내용이 너무 길어 QR이 촘촘한 번호가 ${dense.length}개 있습니다. 이 라벨 크기에서는 스캔이 안 될 수 있어요.`]);
    if (longText.length) msgs.push(['warn', `번호가 길어 글자가 라벨 폭을 넘는 항목이 ${longText.length}개 있습니다.`]);
  }
  $('msgs').innerHTML = msgs.map(([t, m]) => `<div class="msg ${t}">${m}</div>`).join('');
}

function busy(btn, on, label) {
  btn.disabled = on;
  if (on) { btn.dataset.label = btn.textContent; btn.textContent = label; }
  else btn.textContent = btn.dataset.label;
}

function stamp() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

$('btnPdf').addEventListener('click', async () => {
  const btn = $('btnPdf');
  busy(btn, true, 'PDF 만드는 중…');
  await new Promise(r => setTimeout(r, 20));
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    serials.forEach((s, i) => {
      const k = i % PER_PAGE;
      if (i > 0 && k === 0) pdf.addPage();
      const { x, y } = pos(k);
      pdf.addImage(drawLabel(s).canvas.toDataURL('image/png'), 'PNG', x, y, LABEL_W, LABEL_H, undefined, 'FAST');
    });
    pdf.save(`QR라벨_${serials.length}개_${stamp()}.pdf`);
  } catch (e) {
    alert('PDF를 만들지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.\n' + e.message);
  }
  busy(btn, false);
});

$('btnZip').addEventListener('click', async () => {
  const btn = $('btnZip');
  busy(btn, true, 'ZIP 만드는 중…');
  try {
    const zip = new JSZip();
    const used = new Map();
    for (const s of serials) {
      const safe = s.replace(/[\\/:*?"<>|]/g, '_');
      const n = (used.get(safe) || 0) + 1; used.set(safe, n);
      const name = n === 1 ? `${safe}.png` : `${safe}_${n}.png`;
      const blob = await new Promise(r => drawLabel(s).canvas.toBlob(r, 'image/png'));
      zip.file(name, blob);
    }
    const out = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(out);
    a.download = `QR라벨_${serials.length}개_${stamp()}.zip`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) {
    alert('ZIP을 만들지 못했습니다. 페이지를 새로고침한 뒤 다시 시도해 주세요.\n' + e.message);
  }
  busy(btn, false);
});

let t;
$('input').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 250); });
render();
</script>
</body>
</html>
